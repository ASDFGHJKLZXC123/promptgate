name: eval-gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect-eval-scope
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
      trusted: ${{ steps.scope.outputs.trusted }}
    steps:
      - name: Checkout pull-request history
        # actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect evaluation scope and trust boundary
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail

          trusted=false
          if [[ "$PR_HEAD_REPOSITORY" == "$CURRENT_REPOSITORY" &&
            "$PR_AUTHOR" != "dependabot[bot]" &&
            "$PR_ACTOR" != "dependabot[bot]" ]]
          then
            trusted=true
          fi
          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"

          relevant=true
          changed_file_list="${RUNNER_TEMP}/promptgate-changed-files"
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] &&
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$changed_file_list"
          then
            relevant=false
            while IFS= read -r -d '' changed_file; do
              case "$changed_file" in
                packages/gateway/* | \
                packages/evals/* | \
                packages/shared/* | \
                Dockerfile | \
                docker-compose.yml | \
                .dockerignore | \
                .nvmrc | \
                package.json | \
                pnpm-lock.yaml | \
                pnpm-workspace.yaml | \
                tsconfig.base.json | \
                .github/workflows/eval-gate.yml | \
                .github/workflows/ci.yml | \
                .github/actions/*)
                  relevant=true
                  break
                  ;;
              esac
            done < "$changed_file_list"
          else
            echo "::warning::The pull-request diff could not be resolved; running the live gate fail-closed."
          fi
          rm -f -- "$changed_file_list"

          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
          {
            printf '## PromptGate evaluation scope\n\n'
            printf -- '- Relevant change: `%s`\n' "$relevant"
            printf -- '- Trusted source: `%s`\n' "$trusted"
          } >> "$GITHUB_STEP_SUMMARY"

  evaluate:
    name: live-evaluation
    needs: detect
    if: needs.detect.outputs.relevant == 'true' && needs.detect.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        # actions/checkout@v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup pnpm 10.33.0
        # pnpm/action-setup@v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js 22
        # actions/setup-node@v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build gateway image without provider credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -e .env || -e data ]]; then
            echo "::error::The image build requires a clean checkout without runtime state."
            exit 1
          fi
          if ! grep -Fxq '.env' .dockerignore || ! grep -Fxq '.env.*' .dockerignore; then
            echo "::error::.dockerignore must exclude gateway environment files."
            exit 1
          fi

          umask 077
          printf 'ADMIN_TOKEN=%s\n' 'build-only-placeholder-token-0000000000000000' > .env
          docker compose build
          rm -f .env

      - name: Prepare isolated gateway environment
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -Eeuo pipefail

          for secret_name in \
            OPENAI_API_KEY \
            ANTHROPIC_API_KEY \
            GEMINI_API_KEY \
            DEEPSEEK_API_KEY
          do
            secret_value="${!secret_name}"
            if [[ -z "$secret_value" ]]; then
              echo "::error::Missing required repository secret: ${secret_name}"
              exit 1
            fi
            if [[ "$secret_value" == *$'\n'* || "$secret_value" == *$'\r'* ]]; then
              echo "::error::Repository secret ${secret_name} must be a single line."
              exit 1
            fi
          done

          if [[ -e data ]]; then
            echo "::error::The evaluation gate requires an absent data directory."
            exit 1
          fi

          umask 077
          install -d -m 700 data
          admin_token="$(openssl rand -hex 24)"
          key_file="${RUNNER_TEMP}/promptgate-ci-eval.key"
          echo "::add-mask::${admin_token}"

          if [[ -e "$key_file" ]]; then
            echo "::error::The CI key handoff path must be absent before seeding."
            exit 1
          fi

          {
            printf 'ADMIN_TOKEN=%s\n' "$admin_token"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
          } > .env
          chmod 600 .env

          {
            printf 'PG_GATEWAY_URL=%s\n' 'http://127.0.0.1:8787'
            printf 'PG_ADMIN_TOKEN=%s\n' "$admin_token"
            printf 'PG_EVAL_KEY_FILE=%s\n' "$key_file"
          } >> "$GITHUB_ENV"

      - name: Start fresh PromptGate gateway
        run: docker compose up -d --no-build --wait

      - name: Seed CI key, prompts, and dataset
        run: ./node_modules/.bin/pg-eval seed-ci

      - name: Run paired DeepSeek and Terra evaluation gate
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "$PG_EVAL_KEY_FILE" ]]; then
            echo "::error::The CI key handoff file is missing."
            exit 2
          fi

          eval_key="$(<"$PG_EVAL_KEY_FILE")"
          if [[ ! "$eval_key" =~ ^pg-[a-f0-9]{48}$ ]]; then
            echo "::error::The CI key handoff file is invalid."
            exit 2
          fi
          echo "::add-mask::${eval_key}"
          export PG_EVAL_KEY="$eval_key"

          summary_file="${RUNNER_TEMP}/promptgate-eval-summary.md"
          set +e
          ./node_modules/.bin/pg-eval run \
            --dataset safety_screening \
            --prompt safety_screen@candidate \
            --baseline prod \
            --min-request-interval-ms 15000 \
            2>&1 | tee "$summary_file"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"

          if [[ "$tee_status" -ne 0 ]]; then
            echo "::error::The evaluation summary could not be captured."
            status=2
          fi
          if ! {
            printf '## PromptGate evaluation gate\n\n' &&
              cat "$summary_file" &&
              printf '\n\nProcess exit code: `%s`\n' "$status"
          } >> "$GITHUB_STEP_SUMMARY"; then
            echo "::error::The GitHub job summary could not be written."
            status=2
          fi

          case "$status" in
            0)
              ;;
            1)
              echo "::error::Prompt quality regression detected; see the job summary."
              ;;
            2)
              echo "::error::Evaluation infrastructure failed; see the job summary."
              ;;
            *)
              echo "::error::pg-eval returned unexpected exit code ${status}."
              status=2
              ;;
          esac

          unset PG_EVAL_KEY eval_key
          exit "$status"

      - name: Remove ephemeral gateway and secrets
        if: always()
        shell: bash
        run: |
          set +e
          down_status=0
          if [[ -f .env ]]; then
            timeout 180s docker compose down --timeout 150 --volumes --remove-orphans
            down_status="$?"
          fi
          cleanup_status=0
          rm -f .env || cleanup_status=2
          if [[ -n "${PG_EVAL_KEY_FILE:-}" ]]; then
            rm -f -- "$PG_EVAL_KEY_FILE" || cleanup_status=2
          fi
          if [[ "$down_status" -ne 0 ]]; then
            echo "::error::The gateway did not shut down cleanly; the ephemeral database was left untouched."
            exit 2
          fi
          exit "$cleanup_status"

  gate:
    name: eval-gate
    if: always()
    needs: [detect, evaluate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish required evaluation conclusion
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          RELEVANT: ${{ needs.detect.outputs.relevant }}
          TRUSTED: ${{ needs.detect.outputs.trusted }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
        run: |
          set -Eeuo pipefail

          {
            printf '## PromptGate required check\n\n'
            printf -- '- Scope detector: `%s`\n' "$DETECT_RESULT"
            printf -- '- Relevant change: `%s`\n' "${RELEVANT:-unknown}"
            printf -- '- Trusted source: `%s`\n' "${TRUSTED:-unknown}"
            printf -- '- Live evaluation: `%s`\n' "$EVALUATE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Evaluation scope detection failed."
            exit 1
          fi
          if [[ ! "$RELEVANT" =~ ^(true|false)$ || ! "$TRUSTED" =~ ^(true|false)$ ]]; then
            echo "::error::Evaluation scope detection returned invalid outputs."
            exit 1
          fi
          if [[ "$RELEVANT" != "true" ]]; then
            if [[ "$EVALUATE_RESULT" != "skipped" ]]; then
              echo "::error::An irrelevant change produced an unexpected live-evaluation result."
              exit 1
            fi
            printf 'No live provider evaluation was required for this pull request.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$TRUSTED" != "true" ]]; then
            echo "::error::Relevant changes require a trusted same-repository branch."
            exit 1
          fi
          if [[ "$EVALUATE_RESULT" != "success" ]]; then
            echo "::error::The live PromptGate evaluation did not pass."
            exit 1
          fi

          printf 'The live PromptGate evaluation passed.\n' >> "$GITHUB_STEP_SUMMARY"
